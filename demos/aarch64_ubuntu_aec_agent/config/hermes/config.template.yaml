# Copy to %LOCALAPPDATA%/hermes/profiles/local-aec-cloud/config.yaml.
# Replace the endpoint and model placeholders. The key is read from AEC_ENDPOINT_API_KEY.
model:
  default: REPLACE_WITH_MODEL_ID
  provider: custom:aec_cloud
  openai_runtime: auto
  context_length: 131072
  max_tokens: 16384
  supports_vision: true

custom_providers:
  - name: aec_cloud
    base_url: https://REPLACE_WITH_ENDPOINT/v1
    api_mode: chat_completions
    key_env: AEC_ENDPOINT_API_KEY
    model: REPLACE_WITH_MODEL_ID
    models:
      REPLACE_WITH_MODEL_ID:
        context_length: 131072
        supports_vision: true

auxiliary:
  vision:
    provider: main
  compression:
    provider: main
  title_generation:
    provider: main
  mcp:
    provider: main

terminal:
  backend: local
  cwd: REPLACE_WITH_REPOSITORY_PATH
  timeout: 180

memory:
  memory_enabled: false
  user_profile_enabled: false

agent:
  max_turns: 60
  verbose: false
  reasoning_effort: low

mcp_servers:
  rhino:
    command: REPLACE_WITH_RHINO_MCP_ROUTER_EXE
    args:
      - --default-version
      - '8'
    connect_timeout: 75
    timeout: 180
  blender:
    command: REPLACE_WITH_BLENDER_MCP_EXE
    args: []
    connect_timeout: 30
    timeout: 180
    env:
      BLENDER_HOST: localhost
      BLENDER_PORT: '9876'
      DISABLE_TELEMETRY: 'true'
