model:
  provider: custom:local-vllm
  default: __MODEL_ID__
  base_url: __VLLM_BASE_URL__
  context_length: __CONTEXT_LENGTH__

providers:
  local-vllm:
    name: local-vllm
    base_url: __VLLM_BASE_URL__
    default_model: __MODEL_ID__
    api_mode: chat_completions
    context_length: __CONTEXT_LENGTH__

agent:
  reasoning_effort: medium
  max_turns: 80

memory:
  memory_enabled: true
  provider: daystrom_dml
  nudge_interval: 0
  daystrom_dml:
    integration_dir: __DML_ROOT__
    launcher: __DML_ROOT__/bin/hermes-dml-memory
    venv_python: __DML_ROOT__/.venv-dml/bin/python
    source_dir: __DML_ROOT__/source
    storage_dir: __DML_STORE__
    config_path: __DML_ROOT__/config/aec-demo.yaml
    retrieval_policy: always
    enable_memory: true
    enable_personality: false
    sync_turns: false
    top_k: 6
    max_context_chars: 2400
    preflight_strict: true
    timeout_seconds: 30
    project_id: project:cliff-house-modifications-linux
    dcn:
      mode: active_read
tools:
  tool_search:
    enabled: "off"

plugins:
  enabled:
    - daystrom_dml

terminal:
  backend: local
  cwd: __WORKSPACE__
  timeout: 180

mcp_servers:
  hermes_aec:
    command: __AEC_RUNTIME_SERVER__
    args: []
    enabled: true
  daystrom_dml:
    command: __DML_ROOT__/.venv-dml/bin/python
    args: [-m, dml_mcp.dml_mcp_server, --config, __DML_ROOT__/config/aec-demo.yaml, --storage, __DML_STORE__, --transport, stdio]
    enabled: true
  freecad:
    command: __HOME__/.local/bin/freecad-mcp
    args: []
    connect_timeout: 75
    timeout: 320
  blender:
    command: __HOME__/.local/bin/blender-mcp
    args: []
    connect_timeout: 30
    timeout: 320
    env:
      BLENDER_HOST: 127.0.0.1
      BLENDER_PORT: "9876"
      DISABLE_TELEMETRY: "true"
